<mat-toolbar color="primary">
    <mat-toolbar-row fxLayout="row">
        <span class="title-center">Register</span>
    </mat-toolbar-row>
</mat-toolbar>
<mat-dialog-content class="mat-typography">
    <form [formGroup]="registerForm">
        <div fxFlex fxLayout= "Column">
            <mat-form-field appearance="fill" fxflex>
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" required>
                <mat-error *ngIf="registerForm.controls.name.touched && registerForm.controls.name.invalid">
                    <span *ngIf="registerForm.controls.name.errors.required">Must fill it!!!</span>
                    <span *ngIf="registerForm.controls.name.errors.pattern">It's invalid</span>
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" fxflex>
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" required>
                <mat-error *ngIf="registerForm.controls.emailouched && registerForm.controls.email.invalid">
                    <span *ngIf="registerForm.controls.email.errors.required">Must fill it!!!</span>
                    <span *ngIf="registerForm.controls.email.errors.pattern">It's invalid</span>
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" fxflex>
                <mat-label>Phone Number</mat-label>
                <input matInput formControlName="noPhone" required>
                <mat-error *ngIf="registerForm.controls.noPhone.touched && registerForm.controls.noPhone.invalid">
                    <span *ngIf="registerForm.controls.noPhone.errors.required">Must fill it!!!</span>
                    <span *ngIf="registerForm.controls.noPhone.errors.pattern">It's invalid</span>
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" fxflex>
                <mat-label>Password</mat-label>
                <input matInput formControlName="password" type="password" required>
                <mat-error *ngIf="registerForm.controls.password.touched && registerForm.controls.password.invalid">
                    <span *ngIf="registerForm.controls.password.errors.required">Must fill it!!!</span>
                    <span *ngIf="registerForm.controls.password.errors.pattern">It's invalid</span>
                </mat-error>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="center">
    <button mat-raised-button color="primary" (click)="handleSubmit()"
    [disabled]="!(registerForm.valid && registerForm.dirty)">Register</button>
    <button mat-raised-button color="primary" mat-dialog-close>Cancel</button>
</mat-dialog-actions>
